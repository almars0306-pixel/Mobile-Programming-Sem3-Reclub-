name: Flutter CI

# Otomatis jalankan analyze + test setiap ada push atau pull request,
# jadi kode yang error ketahuan sebelum di-merge ke main.
on: [push, pull_request]

jobs:
  analyze-dan-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependencies
        run: flutter pub get

      - name: Analisis kode
        run: flutter analyze

      - name: Jalankan test
        run: flutter test
